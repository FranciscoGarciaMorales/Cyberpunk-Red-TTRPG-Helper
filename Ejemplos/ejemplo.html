<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha Cyberpunk - Demo</title>
  <style>
  /* === Fuentes === */
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');

  /* === Tokens === */
  :root{
    --bg-0:#0e0f13;
    --bg-1:#15171e;
    --txt-0:#e6e9ef;
    --muted:#9aa4b2;

    --neon-purple:#a855f7;
    --neon-blue:#38bdf8;
    --neon-green:#22d3ee;
    --danger:#ef4444;

    --font-title:'Orbitron', sans-serif;
    --font-body:'Rajdhani', sans-serif;
    --font-mono:'Share Tech Mono', monospace;

    --fs-md:1.125rem;
    --fs-lg:1.375rem;
    --fs-xl:1.75rem;
    --fs-2xl:2.25rem;

    --radius:14px;
    --gap:16px;
  }

  /* === Base === */
  body{
    background:var(--bg-0);
    color:var(--txt-0);
    font-family:var(--font-body);
    margin:0;
    padding:20px;
  }

  h1,h2,h3{
    font-family:var(--font-title);
    text-transform:uppercase;
    letter-spacing:1.5px;
  }
  h1{ font-size:var(--fs-2xl) }
  h2{ font-size:var(--fs-xl); color:var(--neon-purple) }
  h3{ font-size:var(--fs-lg); color:var(--neon-blue) }

  .stat{
    font-family:var(--font-mono);
    font-size:var(--fs-md);
    font-variant-numeric:tabular-nums;
  }

  .card{
    background:var(--bg-1);
    border:1px solid #282c37;
    border-radius:var(--radius);
    padding:var(--gap);
    margin-bottom:20px;
    box-shadow:0 0 8px rgba(168,85,247,.25);
  }

  .glow{
    text-shadow:0 0 6px currentColor, 0 0 12px currentColor;
  }

  .hr{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--neon-purple), transparent);
    margin:20px 0;
  }
  </style>
</head>
<body>

  <h1 class="glow">Ficha Cyberpunk</h1>

  <div class="card">
    <h2 class="glow">Rosemary Hacker</h2>
    <p><strong>Role:</strong> Rockerboy</p>
    <p><strong>Ability:</strong> Charismatic Impact - <span class="stat">4</span></p>
    <div class="hr"></div>
    <p><strong>HP:</strong> <span class="stat">30</span>/<span class="stat">40</span></p>
    <p><strong>Humanity:</strong> <span class="stat">65</span>/<span class="stat">100</span></p>
  </div>

  <div class="card">
    <h3 class="glow">Awareness Skills</h3>
    <ul>
      <li>Concentration (WILL): <span class="stat">1 → 7</span></li>
      <li>Perception (INT): <span class="stat">1 → 7</span></li>
      <li>Tracking (INT): <span class="stat">1 → 7</span></li>
    </ul>
  </div>

  <div class="card">
    <h3 class="glow">Body Skills</h3>
    <ul>
      <li>Athletics (DEX): <span class="stat">2 → 8</span></li>
      <li>Stealth (DEX): <span class="stat">1 → 7</span></li>
    </ul>
  </div>

</body>
</html>
